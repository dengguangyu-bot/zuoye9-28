<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>G7 样机对比</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B1220; overflow: hidden;
               font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #view { position: relative; width: 100vw; height: 100vh; }

  .dim-label {
    color: #6FD3F7; font-family: "SF Mono", Consolas, monospace;

  }
  #tag { position: absolute; left: 14px; top: 12px; color: #4FC3F7;

         border: 1px solid rgba(79,195,247,0.3); border-radius: 4px; }
  #err { position: absolute; left: 14px; bottom: 12px; color: #F87171;

         max-width: 90vw; }
